[build]
  command = "bash build.sh"
  publish = "build/site"
  secrets_scan_enabled = false
  ignore = "if [ \"$BUILD_REASON\" = \"api\" ] || [ \"$BUILD_REASON\" = \"manual\" ]; then exit 1; else exit 0; fi"
# Test (DOCU-4995): one rule for removed CTSX pages; the overview is outside the pattern. Remove after the test.
[[redirects]]
  from = "/content-translation-support-ext/:module/*"
  to = "/content-translation-support-ext/"
  status = 301
